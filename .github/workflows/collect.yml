name: collect

# Every 30 minutes. GitHub can start scheduled runs a few minutes late under
# load, which is well inside the two-hour tolerance this feed was built for.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}        # the "Run workflow" button, for testing

permissions:
  contents: write

# never let two runs push at once
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect
        run: python collect.py

      # SOFR and EFFR daily fixings for the dashboard pricer. Never fails the run.
      - name: Fixings
        run: python fixings.py

      # CME open interest for the dashboard. Never fails the run; a backfill
      # is spread over several runs by its own request budget.
      - name: Open interest
        run: python oi.py

      # Eurex (Bund, Bobl, Schatz, Buxl, OAT, BTP, 3M ESTR) and Montreal
      # (3M CORRA) open interest. Never fails the run.
      - name: Open interest (non-US)
        run: python oi_intl.py

      # G10 currencies for the dashboard. The Twelve Data key is a repository
      # SECRET (Settings > Secrets and variables > Actions > TWELVE_DATA_KEY);
      # it is never in the code or the output. Without it the page still works
      # from ECB fixes.
      - name: Currencies
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
        run: python fx.py

      - name: Publish
        run: |
          git config user.name  "stir-news-bot"
          git config user.email "stir-news-bot@users.noreply.github.com"
          git add docs data
          if git diff --cached --quiet; then
            echo "nothing new"
          else
            git commit -m "news $(date -u +%Y-%m-%dT%H:%MZ)"
            # the labelling task pushes tones.json to the same branch, so take
            # its commits first rather than failing the push
            git pull --rebase origin main
            git push
          fi
