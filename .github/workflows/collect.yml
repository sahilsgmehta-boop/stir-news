name: collect

# GitHub's own scheduler starts this repo's cron runs only every 4-8 hours (seen
# Nov 2026), far from the 15 minutes asked for. So each scheduled run now stays
# up for about five and a half hours and collects every 15 minutes itself
# (public repo: Actions minutes are free), then starts its own successor. The
# hourly cron is only the safety net if that chain ever breaks; with one run at
# a time, a waiting run takes over as soon as the loop before it finishes.
# Each pass pulls first, so a code change is live from the next pass.
# To stop it all: Actions > collect > "..." > Disable workflow.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}        # the "Run workflow" button, and the loop's own restart

permissions:
  contents: write
  actions: write               # to start the next loop

# never let two runs push at once
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # One pass runs every collector; none of them can fail the run.
      #   collect.py      central bank news (cb.js, cb_archive.js)
      #   fixings.py      SOFR, EFFR, SONIA, CORRA, ESTR, SARON fixings
      #   oi.py           CME open interest (a backfill spreads over runs)
      #   oi_intl.py      Eurex and Montreal open interest
      #   calendar_feed.py economic calendar + central bank speakers
      #   curves.py       government curves (history once a day)
      #   markets.py      cross-asset performance
      #   repo.py         US repo and funding (paces itself, every 3 hours)
      #   fx.py           G10 currencies; TWELVE_DATA_KEY is a repository SECRET,
      #                   never in the code or the output
      #   cftc.py         CFTC positioning (paces itself, every 6 hours)
      - name: Collect (loop)
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          LOOP_MINUTES: "330"
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install -q openpyxl pypdf || true
          git config user.name  "stir-news-bot"
          git config user.email "stir-news-bot@users.noreply.github.com"
          end=$(( $(date +%s) + LOOP_MINUTES * 60 ))
          while :; do
            echo "::group::pass $(date -u +%H:%MZ)"
            git pull -q --rebase origin main || echo "pull failed"
            for s in collect.py fixings.py oi.py oi_intl.py calendar_feed.py curves.py markets.py repo.py fx.py cftc.py; do
              timeout 600 python "$s" || echo "$s failed"
            done
            git add docs data
            if git diff --cached --quiet; then
              echo "nothing new"
            else
              git commit -q -m "news $(date -u +%Y-%m-%dT%H:%MZ)"
              # the labelling task pushes tones.json to the same branch, so take its commits first
              git pull -q --rebase origin main && git push -q || echo "push failed"
            fi
            echo "::endgroup::"
            now=$(date +%s)
            # the next quarter hour at :07, :22, :37 or :52
            wait=$(( 900 - (now - 420) % 900 ))
            [ $(( now + wait )) -ge $end ] && break
            sleep $wait
          done
          # hand over to a fresh run (it waits in the queue until this one ends)
          gh workflow run collect.yml --ref main -R "$GITHUB_REPOSITORY" || echo "could not start the next loop"
