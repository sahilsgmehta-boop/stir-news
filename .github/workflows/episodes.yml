name: episodes-data
on:
  push:
    branches: [episodes-data]
    paths: [episodes/fetch.py, .github/workflows/episodes.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: episodes-data }
      - run: python3 episodes/fetch.py
      - run: |
          git config user.name "episodes-bot"; git config user.email "episodes-bot@users.noreply.github.com"
          git add episodes; git commit -m "episodes data" || true; git push
