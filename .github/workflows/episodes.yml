name: episodes-data
on:
  push:
    branches: [episodes-data]
    paths: [episodes/fetch.py, .github/workflows/episodes.yml]
permissions:
  contents: write
concurrency: { group: episodes, cancel-in-progress: true }
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: episodes-data }
      - run: timeout 1500 python3 episodes/fetch.py || true
      - if: always()
        run: |
          git config user.name "episodes-bot"; git config user.email "episodes-bot@users.noreply.github.com"
          git add episodes; git commit -m "episodes data" || true; git pull --rebase -q || true; git push
