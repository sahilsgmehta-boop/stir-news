name: mktest
on:
  push:
    branches: [mk-test]
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python probe_mk.py
      - uses: actions/upload-artifact@v4
        with: {name: probe, path: probe_out}
