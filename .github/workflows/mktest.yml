name: mktest
on:
  push:
    branches: [mk-test]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python markets.py --full --dump probe_out/dump; cp docs/markets.js probe_out/markets.js; cp data/markets.json probe_out/store.json
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          rm -rf probe_out/dump; git add -f probe_out && git commit -m "probe output [skip ci]" && git push origin HEAD:mk-test
