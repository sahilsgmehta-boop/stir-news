name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q openpyxl
      - run: mkdir -p probe && python probe.py > probe/out.txt 2>&1 || true
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe/; git commit -m "probe output"; git checkout -- . ; git clean -fdq docs data || true; git pull --rebase -q; git push
