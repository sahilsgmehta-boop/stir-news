name: probe-repo
on:
  push:
    branches: [probe-repo]
    paths: [.github/workflows/probe-repo.yml]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          pip install -q pypdf
          mkdir -p tas
          for q in Q32026 Q42026 Q12027; do
            curl -sS -L -m 60 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -o tas/$q.pdf -w "$q %{http_code} %{size_download} %{content_type}\n" "https://home.treasury.gov/system/files/221/TentativeAuctionSchedule$q.pdf" | tee -a tas/_status.txt
            python -c "import pypdf; r=pypdf.PdfReader('tas/$q.pdf'); open('tas/$q.txt','w').write('\n'.join(p.extract_text() for p in r.pages))" 2>>tas/_status.txt || true
          done
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add -f tas; git commit -qm "tas dump [skip ci]"; git push origin HEAD:probe-repo
